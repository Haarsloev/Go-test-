<!doctype html><html lang="da"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DNDGO • Prototype</title><style>@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap');
:root{--bg:#0c161b;--panel:#17252b;--panel2:#213239;--gold:#d8ad64;--muted:#9aaeb1;--line:#405157;--green:#78c49d;--red:#db746f}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#1d3338,#091216 80%);color:#e9eee9;font-family:Inter,Arial,sans-serif}button,input{font:inherit}button{cursor:pointer}h1,h2,h3,.fantasy{font-family:Cinzel,Georgia,serif}h1{font-size:29px;letter-spacing:2px;color:#f3d49a}h2{font-size:21px;color:#edc783;margin:5px 0 16px}h3{font-size:15px;color:#eac78d;margin:12px 0}.app{max-width:540px;margin:auto;min-height:100dvh;position:relative;overflow:hidden;padding-bottom:92px}.top{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid #405157;background:#112126}.logo{font-family:Cinzel;font-weight:700;letter-spacing:3px;color:var(--gold)}.sub{font-size:11px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase}.content{padding:17px}.card{background:linear-gradient(145deg,#1d3035,#142328);border:1px solid #435354;border-radius:15px;padding:16px;margin:12px 0;box-shadow:0 6px 18px #0002}.row{display:flex;align-items:center;justify-content:space-between;gap:9px}.wrap{flex-wrap:wrap}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.btn{background:#273b3e;color:#e9e6db;border:1px solid #60706c;border-radius:9px;padding:11px 13px;font-weight:600;transition:.15s}.btn:active{transform:scale(.98)}.btn:disabled{opacity:.38;cursor:not-allowed}.primary{background:linear-gradient(135deg,#d5a85f,#ae7b3f);color:#18201d;border-color:#f5d79e}.danger{border-color:#a4514d;color:#ffb7ae}.small{padding:7px 10px;font-size:12px}.muted{color:var(--muted);font-size:12px}.pill{display:inline-block;border:1px solid #5e746e;border-radius:30px;padding:5px 10px;font-size:11px;color:#c5dfd1}.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px}.tabs .btn{flex:1;white-space:nowrap;font-size:12px;padding:9px 7px}.selected{border-color:#f0c477!important;background:#594a32!important;color:#fff!important}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:540px;width:100%;display:flex;justify-content:space-around;background:#0e1d21f5;border-top:1px solid #52635c;padding:11px 5px max(13px,env(safe-area-inset-bottom));z-index:700}.bottom button{background:none;border:0;color:#b7c4be;font-size:12px;display:grid;gap:5px;text-align:center}.bottom .active{color:#f0c879}.bottom span{font-size:21px}.hero{text-align:center;padding:28px 10px;background:radial-gradient(ellipse,#38514b,#17262b 70%);border:1px solid #43534e;border-radius:18px}.avatar{font-size:90px;filter:drop-shadow(0 12px 14px #0009);line-height:1.5}.avatar.mini{font-size:54px}.stat{background:#1a2d31;border:1px solid #3e5456;border-radius:10px;padding:11px}.stat strong{display:block;font-size:19px;color:#f1d096;margin-top:5px}.meter{height:14px;background:#0a1417;border:1px solid #516360;border-radius:10px;overflow:hidden;position:relative}.meter>div{height:100%;transition:width .35s}.hp-high{background:linear-gradient(90deg,#397c58,#8acb8b)}.hp-mid{background:linear-gradient(90deg,#a05d29,#edb35b)}.hp-low{background:linear-gradient(90deg,#842c36,#f16d67)}.hp-critical{animation:pulse .7s infinite alternate}@keyframes pulse{to{opacity:.48}}.meterlabel{display:flex;justify-content:space-between;margin:6px 0;font-size:12px}.encounter{display:flex;align-items:center;gap:12px;padding:12px;background:#203337;border:1px solid #405957;border-radius:12px;margin:8px 0;cursor:pointer}.encounter .icon{font-size:29px}.encounter .details{flex:1}.encounter small{display:block;color:var(--muted);margin-top:3px}.mapbox{height:48dvh;min-height:310px;border-radius:14px;overflow:hidden;border:2px solid #556658;background:#233f42}.leaflet-container{background:#203b3e!important}.marker{font-size:27px;text-shadow:0 3px 8px #000;border:0!important;background:none!important}.notice{padding:11px;border-left:3px solid var(--gold);background:#28352f;border-radius:4px;font-size:12px;color:#d3d9c9}.inventory{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.slot{min-height:61px;background:#0f1e22;border:1px solid #4a5b59;border-radius:7px;text-align:center;padding:5px 2px;font-size:10px;word-break:break-word}.slot b{display:block;font-size:18px}.log{max-height:180px;overflow-y:auto;font-size:12px;color:#d5d9cf}.log p{margin:5px 0;padding:5px;border-bottom:1px solid #35494b}.floating{position:absolute;pointer-events:none;font-size:25px;font-weight:800;animation:float 1.2s forwards;text-shadow:0 2px 7px #000;z-index:100}@keyframes float{to{opacity:0;transform:translateY(-60px)}}input{width:100%;background:#0b1b20;color:white;border:1px solid #63746a;border-radius:8px;padding:13px}.spacer{height:15px}.badge{font-size:11px;color:#e8c78b}.talent{padding:11px;background:#1c2e32;border:1px solid #4d5e59;border-radius:10px;margin:7px 0}.talent.unlocked{border-color:#6dbf83;background:#243c35}.talent.locked{opacity:.58}.sectiontitle{font-family:Cinzel;color:#e4c28b;margin-top:20px}.center{text-align:center}.onboard{padding:24px 17px}.gearline{padding:9px;border-bottom:1px solid #405052;font-size:13px}.hidden{display:none}.overlay{position:fixed;inset:0;background:#000b;z-index:1000;display:grid;place-items:center;padding:18px}.modal{width:min(100%,520px);max-height:85dvh;overflow:auto;background:#18292e;border:1px solid #c09a5c;border-radius:17px;padding:20px}.tag{font-size:11px;border:1px solid #697b73;border-radius:6px;padding:3px 6px;color:#b7d1c1}

html,body{height:100%;overflow:hidden}.app{height:100dvh;min-height:0;display:flex;flex-direction:column;padding-bottom:0}.top{flex-shrink:0;padding:10px 14px}.content{flex:1;min-height:0;overflow-y:auto;padding:10px 12px 85px;overscroll-behavior:contain}.mapbox{height:calc(100dvh - 275px);min-height:180px}.compact-hero{padding:8px}.compact-hero .avatar{font-size:42px}.compact-hero h2{margin:0}.craft-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}.craft-column{min-width:0;padding:5px;border:1px solid #435354;border-radius:8px}.craft-column h3{font-size:10px;overflow-wrap:anywhere}.craft-column small{font-size:9px;display:block;overflow-wrap:anywhere}.craft-column .btn{font-size:9px;padding:5px 2px;width:100%;overflow-wrap:anywhere}.craft-recipe{margin-top:8px;padding:5px 2px;border-top:1px solid #435354}.craft-recipe b{font-size:10px;overflow-wrap:anywhere;display:block}.tree-scroll{overflow:auto;max-height:calc(100dvh - 240px)}.tree{min-width:320px;display:flex;align-items:center;flex-direction:column;padding:10px 0}.tree-tier{display:flex;gap:8px;justify-content:center;align-items:stretch;width:100%}.tree-node{flex:1;max-width:125px;min-width:55px;min-height:68px;border-radius:12px;background:#1b3034;border:2px solid #63746a;color:#f1d096;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:5px;cursor:pointer}.tree-node span{font-size:24px}.tree-node small{font-size:10px;overflow-wrap:anywhere}.tree-node.unlocked{border-color:#78c49d;background:#254439}.tree-node.ready{border-color:#eac78d}.tree-node.locked{opacity:.45}.tree-connector{color:#d8ad64;text-align:center;line-height:14px;height:35px}.tabs{flex-shrink:0}.tabs .btn{font-size:11px;padding:8px 5px}.bottom{flex-shrink:0}

/* v1.5: keep primary map and navigation within the visible mobile viewport */
html,body{height:100%;overflow:hidden}
.app{height:100dvh;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.top{flex:0 0 auto}
.content{flex:1 1 auto;min-height:0;overflow-y:auto;padding:9px 12px 10px;scrollbar-width:thin}
.bottom{position:relative;left:auto;bottom:auto;transform:none;width:100%;max-width:none;flex:0 0 auto;margin-top:auto}
.content:has(.mapbox){display:flex;flex-direction:column;overflow:hidden;gap:6px}
.content:has(.mapbox)>*{flex-shrink:0}
.content:has(.mapbox) .mapbox{height:auto;min-height:100px;flex:1 1 auto}
.content:has(.mapbox) h2{margin:0;font-size:17px}
.content:has(.mapbox) .row{margin-top:0!important}
.content:has(.mapbox)>p.muted{display:none}
.nearby-list{max-height:26dvh;overflow:auto;font-size:12px}
.nearby-list summary{cursor:pointer;color:var(--gold);padding:5px}
.nearby-list .encounter{padding:6px;margin:4px 0}
@media(max-height:700px){.top{padding:6px 12px}.bottom{padding:5px 4px max(5px,env(safe-area-inset-bottom))}.bottom span{font-size:18px}.content{padding:6px 10px}}

/* Skill XP overlay: doesn't replace the current view */
#skill-xp-notices{position:fixed;z-index:2500;top:calc(env(safe-area-inset-top,0px) + 60px);right:10px;width:min(265px,calc(100vw - 20px));pointer-events:none;display:grid;gap:7px}
.skill-xp-popup{padding:10px 12px;background:rgba(17,34,38,.94);border:1px solid #bd985c;border-radius:12px;color:#f8e9c5;box-shadow:0 5px 22px #0007;opacity:0;transform:translateX(25px);transition:opacity .3s,transform .3s}
.skill-xp-active{opacity:1;transform:translateX(0);animation:skill-xp-shake .36s ease-out .2s}
.skill-xp-title{display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:13px;gap:10px}
.skill-xp-fly{color:#e8c16c;font-size:13px;white-space:nowrap;animation:skill-xp-fly .7s ease-out forwards}
.skill-xp-track{height:9px;border-radius:12px;background:#364548;overflow:hidden;margin-top:8px;border:1px solid #7b725c}
.skill-xp-fill{height:100%;background:linear-gradient(90deg,#a47e3e,#efd280);transition:width .5s ease-out}
.skill-xp-count{display:block;text-align:right;color:#c1c5bc;font-size:10px;margin-top:3px}
@keyframes skill-xp-fly{0%{transform:translateX(18px);opacity:0}65%{transform:translateX(-5px);opacity:1}100%{transform:translateX(0);opacity:1}}
@keyframes skill-xp-shake{0%,100%{translate:0 0}20%{translate:-3px 0}45%{translate:4px 0}70%{translate:-2px 0}}
@media(prefers-reduced-motion:reduce){.skill-xp-popup,.skill-xp-fly{animation:none;transition:none}}

/* Character level-up overlay independent of toasts and screen rerenders */
#character-level-overlay{position:fixed;inset:0;z-index:9000;display:grid;place-items:center;padding:20px;background:rgba(4,13,17,.75);backdrop-filter:blur(4px)}
.character-level-card{width:min(380px,100%);padding:30px 20px;text-align:center;border:2px solid #d9ad66;border-radius:20px;background:linear-gradient(150deg,#203a3c,#102124);color:#f6e5bc;box-shadow:0 0 55px #d9ad6666;animation:level-appear .4s ease-out}
.level-spark{font-size:28px;color:#f4c875;animation:level-glow 1.5s ease-in-out infinite alternate}
.level-heading{font-size:30px;font-weight:900;letter-spacing:3px;color:#f1c56f;margin:12px 0}
.level-number{font-size:20px;font-weight:bold}.character-level-card p{font-size:14px;margin:13px 0}.character-level-card button{margin-top:15px}
@keyframes level-appear{from{opacity:0;transform:scale(.82)}to{opacity:1;transform:scale(1)}}
@keyframes level-glow{from{opacity:.55}to{opacity:1}}
</style>
